name: Application CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: application-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and packaged contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.0.0
          run_install: false
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck, lint, offline tests, and build
        run: pnpm run check
      - name: Pack the actual distribution
        run: pnpm pack --out contract-package.tgz
      - name: Exercise packaged stdio and CLI contracts offline
        run: pnpm run test:smoke
      - name: Verify lockfile and whitespace
        run: |
          git diff --exit-code -- pnpm-lock.yaml
          git diff --check
